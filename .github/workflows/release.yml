name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: ubuntu-22.04
            target: linux-amd64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source tests
        run: |
          python -m unittest discover -s tests -v
          node --check web/app.js
          node tests/test_prompt_ui.js
      - name: Verify tag matches client version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from session_doctor import __version__
          expected = 'v' + __version__
          actual = os.environ['RELEASE_TAG']
          if actual != expected:
              raise SystemExit(f'Release tag {actual} must match {expected}')
          PY
      - name: Install build dependency
        run: python -m pip install -r requirements-build.txt
      - name: Build archive
        run: python scripts/build_release.py
      - name: Smoke test standalone client
        shell: bash
        run: |
          set -euo pipefail
          python scripts/smoke_release.py "$PWD/build/pyinstaller-dist/codex-doctor"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/codex-doctor-${{ matrix.target }}.tar.gz
            dist/codex-doctor-${{ matrix.target }}.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: assets
          merge-multiple: true
      - name: Publish one release after all builds pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --verify-tag --title "$GITHUB_REF_NAME" --notes 'Standalone Codex Session Doctor clients for Apple Silicon macOS and Linux arm64/amd64.'
