name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-amd64
          - runner: ubuntu-22.04
            target: linux-amd64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source tests
        run: |
          python -m unittest discover -s tests -v
          node --check web/app.js
          node tests/test_prompt_ui.js
      - name: Verify tag matches client version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from session_doctor import __version__
          expected = 'v' + __version__
          actual = os.environ['RELEASE_TAG']
          if actual != expected:
              raise SystemExit(f'Release tag {actual} must match {expected}')
          PY
      - name: Install build dependency
        run: python -m pip install -r requirements-build.txt
      - name: Build archive
        run: python scripts/build_release.py
      - name: Smoke test standalone client
        shell: bash
        run: |
          set -euo pipefail
          binary="$PWD/build/pyinstaller-dist/codex-doctor"
          "$binary" --version
          tmp="$(mktemp -d)"
          port="$(python -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          trap '"$binary" stop --data-dir "$tmp/state" --port "$port" >/dev/null 2>&1 || true; rm -rf "$tmp"' EXIT
          "$binary" start --data-dir "$tmp/state" --codex-home "$tmp/empty-codex" --port "$port"
          python - "$port" <<'PY'
          import json, sys, time, urllib.request
          root = f'http://127.0.0.1:{sys.argv[1]}'
          for _ in range(30):
              try:
                  with urllib.request.urlopen(root + '/api/health', timeout=2) as response:
                      health = json.load(response)
                  assert health['service'] == 'codex-session-doctor'
                  with urllib.request.urlopen(root + '/', timeout=2) as response:
                      assert b'<html' in response.read().lower()
                  with urllib.request.urlopen(root + '/app.js', timeout=2) as response:
                      assert response.status == 200 and response.read()
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('standalone service did not become ready')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/codex-doctor-${{ matrix.target }}.tar.gz
            dist/codex-doctor-${{ matrix.target }}.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: assets
          merge-multiple: true
      - name: Publish one release after all builds pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --verify-tag --title "$GITHUB_REF_NAME" --notes 'Standalone Codex Session Doctor clients for macOS and Linux.'
